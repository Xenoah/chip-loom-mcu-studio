name: Release

# Three ways in, all of which end in the same place:
#
#   * pushing a `v*` tag -- the normal path;
#   * `workflow_dispatch` with a tag -- for a re-run, or when the tag already exists;
#   * `repository_dispatch` of type `release` with `client_payload.tag` -- for an
#     automation that can reach the API but cannot push a tag.
#
# The last two create the tag as part of publishing, so neither may try to check
# the tag out first.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and publish, e.g. v0.1.0-pre.0"
        required: true
  repository_dispatch:
    types: [release]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      notes: ${{ steps.tag.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      # Everything that can be checked cheaply is checked here, before five
      # builds are spent discovering that the tag is malformed or the notes are
      # missing.
      - name: Work out and validate the tag
        id: tag
        env:
          FROM_DISPATCH: ${{ inputs.tag }}
          FROM_PAYLOAD: ${{ github.event.client_payload.tag }}
          FROM_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${FROM_DISPATCH}" ]; then
            tag="${FROM_DISPATCH}"
          elif [ -n "${FROM_PAYLOAD}" ]; then
            tag="${FROM_PAYLOAD}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${FROM_REF}"
          else
            echo "::error::No tag given. Pass one as a workflow input or as client_payload.tag."
            exit 1
          fi

          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::\`$tag\` is not a Chip Loom release tag (vMAJOR.MINOR.PATCH[-pre.N])"
            exit 1
          fi

          notes="docs/releases/${tag}.md"
          if [ ! -f "$notes" ]; then
            # A release with no notes is not a release.
            echo "::error::No release notes at $notes"
            exit 1
          fi

          # Only a bare vX.Y.Z is a finished product; everything else is history.
          if printf '%s' "$tag" | grep -q -- '-'; then prerelease=true; else prerelease=false; fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          {
            echo "### Release ${tag}"
            echo
            echo "* prerelease: \`${prerelease}\`"
            echo "* notes: \`${notes}\`"
            echo "* commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check that the version in the tree matches the tag
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          want="${tag#v}"

          crate=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          ext=$(node -e "process.stdout.write(require('./extension/package.json').version)")

          fail=0
          [ "$crate" = "$want" ] || { echo "::error::Cargo.toml says $crate, tag says $want"; fail=1; }
          [ "$ext" = "$want" ] || { echo "::error::extension/package.json says $ext, tag says $want"; fail=1; }
          # A binary whose --version disagrees with the release it shipped in is
          # unreportable, so this is a hard failure rather than a warning.
          [ "$fail" = "0" ] || exit 1

  build:
    name: Build ${{ matrix.target }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            # Cross-compiled on an x86-64 runner, so the result cannot be run here.
            smoke: false
            apt: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            # macos-latest is Apple Silicon with no Rosetta, so an x86-64 binary
            # cannot be executed on it.
            smoke: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            smoke: true
    steps:
      - uses: actions/checkout@v4
        with:
          # `build.rs` records the commit in the binary, so the full history is
          # needed for the version string to be meaningful.
          fetch-depth: 0

      - name: Install the cross linker
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bin chiploom

      - name: Verify the binary runs and reports itself
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/chiploom"
          [ "${{ matrix.archive }}" = "zip" ] && bin="${bin}.exe"
          "$bin" --version
          "$bin" --help > /dev/null
          "$bin" doctor

      - name: Note that this artifact was not run
        if: ${{ !matrix.smoke }}
        run: echo "::warning::${{ matrix.target }} is cross-compiled here, so it was built but not executed. The release notes must say so."

      - name: Package
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          name="chiploom-${RELEASE_TAG}-${{ matrix.target }}"
          staging="dist/${name}"
          mkdir -p "$staging"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/chiploom.exe" "$staging/"
          else
            cp "target/${{ matrix.target }}/release/chiploom" "$staging/"
          fi
          cp LICENSE NOTICE README.md README.ja.md CHANGELOG.md "$staging/"
          cp -r docs "$staging/docs"

          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${name}.zip" "${name}" > /dev/null
            archive="${name}.zip"
          else
            tar czf "${name}.tar.gz" "${name}"
            archive="${name}.tar.gz"
          fi

          # A published artifact without a checksum cannot be verified, so every
          # archive ships one next to it.
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
          echo "archive=dist/${archive}" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${archive}.sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: chiploom-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

  extension:
    name: Build the VS Code extension
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Compile
        working-directory: extension
        run: npm run compile

      - name: Package the extension
        working-directory: extension
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # The .vsix has to carry the licence itself; it is not committed here.
          cp ../LICENSE LICENSE
          npx --yes @vscode/vsce@latest package \
            --no-dependencies \
            --allow-missing-repository \
            --out "chiploom-${RELEASE_TAG}.vsix"
          sha256sum "chiploom-${RELEASE_TAG}.vsix" > "chiploom-${RELEASE_TAG}.vsix.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: chiploom-vsix
          path: |
            extension/*.vsix
            extension/*.vsix.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [resolve, build, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -lR artifacts

      - name: Check that every expected artifact is present
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            "chiploom-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            "chiploom-${RELEASE_TAG}-aarch64-unknown-linux-gnu.tar.gz" \
            "chiploom-${RELEASE_TAG}-aarch64-apple-darwin.tar.gz" \
            "chiploom-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz" \
            "chiploom-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip" \
            "chiploom-${RELEASE_TAG}.vsix"
          do
            [ -f "artifacts/${name}" ] || { echo "::error::missing artifact ${name}"; missing=1; }
            [ -f "artifacts/${name}.sha256" ] || { echo "::error::missing checksum ${name}.sha256"; missing=1; }
          done
          [ "$missing" = "0" ] || exit 1

      - name: Verify every checksum
        working-directory: artifacts
        run: |
          set -euo pipefail
          for file in *.sha256; do sha256sum -c "$file"; done

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          # On a dispatch the tag does not exist yet; create it at this commit.
          target_commitish: ${{ github.sha }}
          body_path: ${{ needs.resolve.outputs.notes }}
          prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}
          files: artifacts/**
          fail_on_unmatched_files: true

      - name: Summarise
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          {
            echo "### Published ${RELEASE_TAG}"
            echo
            echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
